<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZRUSSO KEY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      width: min(92%, 430px);
      padding: 32px 22px;
      text-align: center;

      border: 2px solid #00f5d4;
      border-radius: 18px;

      box-shadow:
        0 0 18px #00f5d4,
        inset 0 0 18px rgba(0, 245, 212, 0.12);
    }

    h1 {
      margin: 0 0 12px;

      color: #00f5d4;
      font-size: 28px;

      text-shadow:
        0 0 12px #00f5d4;
    }

    .subtitle {
      margin: 0 0 25px;

      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;

      padding: 14px 18px;

      border: none;
      border-radius: 10px;

      background: #00f5d4;
      color: #001411;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 14px rgba(0, 245, 212, 0.55);

      transition: transform 0.15s ease;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 18px;

      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>⚡ ZRUSSO KEY ⚡</h1>

    <p class="subtitle">
      Obtén tu llave diaria. Completa el proceso para recibir tu key.
    </p>

    <button id="getKey">
      OBTENER KEY
    </button>

    <div class="note">
      La llave cambia diariamente.
    </div>

  </main>


  <script>

    // Enlace de Linkvertise / Link-Center
    const LINKVERTISE_URL =
      "https://link-center.net/9743264/n4Xnw8jffHet";


    // Botón OBTENER KEY
    document.getElementById("getKey").addEventListener("click", function () {

      window.location.href = LINKVERTISE_URL;

    });

  </script>

</body>
</html>
