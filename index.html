<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRUSSO KEY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050607}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;font-family:Arial,Helvetica,sans-serif;color:#fff
}
.card{
  width:100%;max-width:745px;background:#0c1010;
  border:4px solid #00f5bd;border-radius:30px;
  padding:55px 60px 45px;text-align:center;
  box-shadow:0 0 18px #00f5bd,0 0 45px rgba(0,245,189,.35)
}
h1{
  margin:0 0 25px;color:#00f5bd;font-size:46px;
  letter-spacing:4px;font-weight:900;text-shadow:0 0 12px #00f5bd
}
.sub{
  margin:0 auto 42px;max-width:560px;color:#aaa;
  font-size:25px;line-height:1.35
}
.key{
  padding:22px 12px;border:2px dashed #00f5bd;border-radius:14px;
  background:#111717;color:#fff;font-size:38px;font-weight:900;
  letter-spacing:5px;text-shadow:0 0 12px #fff;word-break:break-all
}
button{
  width:100%;margin-top:25px;padding:20px;border-radius:15px;
  background:#0c1010;color:#00f5bd;border:4px solid #00f5bd;
  font-size:27px;font-weight:900;letter-spacing:2px;
  box-shadow:0 0 18px rgba(0,245,189,.55)
}
.note{margin-top:30px;color:#555;font-size:20px}
@media(max-width:600px){
  .card{padding:45px 22px 35px}
  h1{font-size:34px;letter-spacing:3px}
  .sub{font-size:20px;margin-bottom:32px}
  .key{font-size:27px;letter-spacing:3px}
  button{font-size:21px;padding:17px}
  .note{font-size:17px}
}
</style>
</head>
<body>
<div class="card">
  <h1>⚡ ZRUSSO KEY ⚡</h1>
  <p class="sub">Copia tu llave diaria e ingrésala en el ejecutor Delta.</p>
  <div class="key" id="key">GENERANDO...</div>
  <button id="copy">COPIAR KEY</button>
  <div class="note">La llave cambia a la medianoche.</div>
</div>

<script>
const KEY_NAME="zr_key";

function generateKey(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return "ZR-"+s;
}

let key=localStorage.getItem(KEY_NAME);
const today=new Date().toDateString();
const savedDay=localStorage.getItem(KEY_NAME+"_day");

if(!key || savedDay!==today){
  key=generateKey();
  localStorage.setItem(KEY_NAME,key);
  localStorage.setItem(KEY_NAME+"_day",today);
}

document.getElementById("key").textContent=key;

document.getElementById("copy").addEventListener("click",async function(){
  try{
    await navigator.clipboard.writeText(key);
  }catch(e){
    const t=document.createElement("textarea");
    t.value=key;document.body.appendChild(t);t.select();
    document.execCommand("copy");t.remove();
  }
  this.textContent="✓ KEY COPIADA";
  setTimeout(()=>this.textContent="COPIAR KEY",1600);
});
</script>
</body>
</html>
