<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZRUSSO KEY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      width: min(92%, 430px);
      padding: 32px 22px;
      text-align: center;

      border: 2px solid #00f5d4;
      border-radius: 18px;

      box-shadow:
        0 0 18px #00f5d4,
        inset 0 0 18px rgba(0,245,212,.12);
    }

    h1 {
      margin: 0 0 22px;

      color: #00f5d4;
      font-size: 28px;

      text-shadow:
        0 0 12px #00f5d4;
    }

    .loading {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .key {
      display: none;

      padding: 14px 18px;
      margin-bottom: 15px;

      border-radius: 10px;

      background: #111;
      border: 1px solid #00f5d4;

      color: #fff;
      font-size: 22px;
      font-weight: bold;

      letter-spacing: 2px;
      user-select: all;
    }

    .copy {
      display: none;

      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 10px;

      background: #00f5d4;
      color: #001411;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 14px rgba(0,245,212,.55);
    }

    .status {
      margin-top: 15px;

      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff5555;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>⚡ ZRUSSO KEY ⚡</h1>

    <div class="loading" id="loading">
      Generando tu key...
    </div>

    <div class="key" id="key"></div>

    <button class="copy" id="copy">
      COPIAR KEY
    </button>

    <div class="status" id="status"></div>

  </main>


  <script>

    // API DE ZRUSSO
    const API_URL =
      "https://zrusso-key-api.miguelpardo1555.workers.dev/generate";


    const loading = document.getElementById("loading");
    const keyElement = document.getElementById("key");
    const copyButton = document.getElementById("copy");
    const status = document.getElementById("status");


    // SOLICITAR UNA KEY AL SERVIDOR
    async function generateKey() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Error HTTP " + response.status);
        }

        const data = await response.json();


        if (!data.success || !data.key) {
          throw new Error("La API no devolvió una key.");
        }


        // Mostrar key
        keyElement.textContent = data.key;

        loading.style.display = "none";
        keyElement.style.display = "inline-block";
        copyButton.style.display = "block";

        status.textContent =
          "Tu key es válida durante 24 horas.";


      } catch (error) {

        loading.textContent =
          "No se pudo generar la key.";

        loading.classList.add("error");

        status.textContent =
          "Intenta nuevamente en unos segundos.";

        console.error(error);
      }
    }


    // COPIAR KEY
    copyButton.addEventListener("click", async function () {

      const key = keyElement.textContent;

      try {

        await navigator.clipboard.writeText(key);

        copyButton.textContent = "✓ KEY COPIADA";

        setTimeout(function () {
          copyButton.textContent = "COPIAR KEY";
        }, 2000);

      } catch (error) {

        // Alternativa para navegadores que no permiten clipboard
        const textArea = document.createElement("textarea");

        textArea.value = key;
        document.body.appendChild(textArea);

        textArea.select();

        document.execCommand("copy");

        textArea.remove();

        copyButton.textContent = "✓ KEY COPIADA";

        setTimeout(function () {
          copyButton.textContent = "COPIAR KEY";
        }, 2000);
      }

    });


    // INICIAR
    generateKey();

  </script>

</body>
</html>
