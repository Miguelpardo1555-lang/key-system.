<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZRUSSO KEY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
  font-family: Arial, sans-serif;
  color: #fff;
}

.card {
  width: min(92%, 430px);
  padding: 32px 22px;
  text-align: center;

  border: 2px solid #00f5d4;
  border-radius: 18px;

  box-shadow:
    0 0 18px #00f5d4,
    inset 0 0 18px rgba(0, 245, 212, 0.12);
}

h1 {
  margin: 0 0 22px;
  color: #00f5d4;
  font-size: 28px;

  text-shadow:
    0 0 12px #00f5d4;
}

.key {
  display: inline-block;
  padding: 14px 18px;
  margin-bottom: 14px;

  border-radius: 10px;
  background: #111;
  border: 1px solid #00f5d4;

  color: #fff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;

  user-select: all;
}

button {
  width: 100%;
  padding: 14px 18px;

  border: none;
  border-radius: 10px;

  background: #00f5d4;
  color: #001411;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 14px rgba(0, 245, 212, 0.55);
}

button:active {
  transform: scale(0.98);
}

p {
  margin: 14px 0 0;
  color: #aaa;
  font-size: 14px;
}

.note {
  margin-top: 18px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<main class="card">

  <h1>⚡ ZRUSSO KEY ⚡</h1>

  <div class="key" id="key">
    ZR-XXXXXX
  </div>

  <button id="copyKey">
    COPIAR KEY
  </button>

  <p>
    Tu key está disponible durante el día.
  </p>

  <div class="note">
    La key cambia automáticamente cada día.
  </div>

</main>

<script>

const PREFIX = "ZR-";
const STORAGE_NAME = "zrusso_daily_key";

// Fecha local del dispositivo: YYYY-MM-DD
function getToday() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

// Generar key
function generateKey() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let value = "";

  for (let i = 0; i < 6; i++) {
    value += chars[
      Math.floor(Math.random() * chars.length)
    ];
  }

  return PREFIX + value;
}

const today = getToday();

let saved = null;

try {
  saved = JSON.parse(
    localStorage.getItem(STORAGE_NAME) || "null"
  );
} catch (e) {
  saved = null;
}

let key;

// Si todavía es el mismo día, conservar la key
if (
  saved &&
  saved.date === today &&
  saved.key
) {

  key = saved.key;

} else {

  // Nuevo día = nueva key
  key = generateKey();

  localStorage.setItem(
    STORAGE_NAME,
    JSON.stringify({
      date: today,
      key: key
    })
  );
}

// Mostrar key
document.getElementById("key").textContent = key;


// Botón copiar
document.getElementById("copyKey").addEventListener(
  "click",
  async function () {

    try {

      await navigator.clipboard.writeText(key);

      this.textContent = "✅ KEY COPIADA";

      setTimeout(() => {
        this.textContent = "COPIAR KEY";
      }, 1500);

    } catch (error) {

      alert("Copia esta key: " + key);

    }

  }
);

</script>

</body>
</html>
