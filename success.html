<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRUSSO KEY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;font-family:Arial,sans-serif;color:#fff}
.card{width:min(92%,430px);padding:32px 22px;text-align:center;border:2px solid #00f5d4;border-radius:18px;box-shadow:0 0 18px #00f5d4,inset 0 0 18px rgba(0,245,212,.12)}
h1{margin:0 0 22px;color:#00f5d4;font-size:28px;text-shadow:0 0 12px #00f5d4}
.key{display:inline-block;padding:14px 18px;margin-bottom:12px;border-radius:10px;background:#111;border:1px solid #00f5d4;color:#fff;font-size:22px;font-weight:bold;letter-spacing:2px;user-select:all}
p{margin:8px 0 0;color:#aaa;font-size:14px}
</style>
</head>
<body>
<main class="card">
<h1>⚡ ZRUSSO KEY ⚡</h1>
<div class="key" id="key">ZR-XXXXXX</div>
<p>Tu key está lista.</p>
</main>
<script>
const prefix="ZR-",today=new Date().toISOString().slice(0,10);
const saved=JSON.parse(localStorage.getItem("zrusso_daily_key")||"null");
let key;
if(saved&&saved.date===today&&saved.key){key=saved.key}else{
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let value="";
for(let i=0;i<6;i++)value+=chars[Math.floor(Math.random()*chars.length)];
key=prefix+value;localStorage.setItem("zrusso_daily_key",JSON.stringify({date:today,key}));
}
document.getElementById("key").textContent=key;
</script>
</body>
</html>
